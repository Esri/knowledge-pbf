syntax = "proto3";
package esriPBuffer.graph;
option java_package = "com.esri.arcgis.protobuf.graph";
option optimize_for = LITE_RUNTIME;
option cc_enable_arenas = true;

import "esriPBuffer/graph/EsriGraphTypes.proto";

// ../KnowledgeGraphServer/graph/truncate

// Synchronous response from a truncate request. Because truncate is strictly
// asynchronous, on successful submission the response only carries the URL
// the client polls for status and final results.
message TruncateResponse {
  // High-level error indicating the truncate request could not be submitted.
  // Examples: validation error, unsupported service (non-ArangoDB), sync-enabled
  // service, insufficient privileges, or a conflicting in-progress operation.
  Error error = 1;

  // URL the client polls for status. Of the form
  // ../KnowledgeGraphServer/jobs/status/<job-id>.
  // The final TruncateResult is fetched via the corresponding
  // ../KnowledgeGraphServer/jobs/results/<job-id> endpoint.
  string async_status_url = 2;
}